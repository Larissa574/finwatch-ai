<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#edf3f8;font:16px Arial,sans-serif;color:#18344a;margin:0}.carte{max-width:540px;margin:9vh auto;background:#fff;padding:34px;border-radius:14px;box-shadow:0 10px 30px #1233}h1{color:#103c61}button{background:#103c61;color:white;border:0;border-radius:9px;padding:13px 24px;cursor:pointer}button:disabled{opacity:.5}#etat{margin-top:20px;line-height:1.5}</style></head><body><div class="carte"><h1>FINWATCH AI</h1><h2>Se désabonner</h2><? if (valide) { ?><p>Souhaites-tu arrêter de recevoir les bulletins FINWATCH AI à l'adresse <strong><?= adresse ?></strong> ?</p><div id="donnees" data-email="<?= adresse ?>" data-token="<?= jeton ?>"></div><button id="confirmer" type="button">Confirmer ma désinscription</button><p id="etat" role="status" aria-live="polite"></p><script>const email=document.getElementById('donnees').dataset.email,token=document.getElementById('donnees').dataset.token;document.getElementById('confirmer').onclick=function(){const b=this,e=document.getElementById('etat');b.disabled=true;e.textContent='Traitement en cours…';google.script.run.withSuccessHandler(function(message){e.textContent=message;b.style.display='none';}).withFailureHandler(function(err){e.textContent=err.message||'Une erreur est survenue';b.disabled=false;}).confirmerDesinscription(email,token);};</script><? } else { ?><p>Ce lien de désinscription est invalide. Aucune modification n'a été effectuée.</p><? } ?></div></body></html>
