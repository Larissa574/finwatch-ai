name: FINWATCH AI - diffusion abonnés
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 5'
permissions:
  contents: read
concurrency:
  group: finwatch-envoi
  cancel-in-progress: false
jobs:
  diffuser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      FINWATCH_WEBAPP_URL: ${{ secrets.FINWATCH_WEBAPP_URL }}
      FINWATCH_HMAC_SECRET: ${{ secrets.FINWATCH_HMAC_SECRET }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.SMTP_USER }}
      FINWATCH_AUTORISER_ENVOI: ${{ vars.FINWATCH_AUTORISER_ENVOI }}
      FINWATCH_MAX_DESTINATAIRES: '50'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diffusion (mode simulation par défaut)
        run: |
          if [ "$FINWATCH_AUTORISER_ENVOI" = "OUI" ]; then
            python src/diffusion_automatique.py --send
          else
            python src/diffusion_automatique.py
          fi
