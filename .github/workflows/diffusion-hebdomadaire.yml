name: FINWATCH AI - diffusion abonnés
on:
  workflow_dispatch:
    inputs:
      mode_test_prive:
        description: 'Envoyer uniquement a FINWATCH_TEST_EMAIL'
        type: boolean
        default: false
      campagne_test:
        description: 'Identifiant pour test prive'
        type: string
        default: 'verification-privee-01'
  schedule:
    - cron: '0 11 * * 6'
permissions:
  contents: read
concurrency:
  group: finwatch-envoi
  cancel-in-progress: false
jobs:
  diffuser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      FINWATCH_WEBAPP_URL: ${{ secrets.FINWATCH_WEBAPP_URL }}
      FINWATCH_HMAC_SECRET: ${{ secrets.FINWATCH_HMAC_SECRET }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '465'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM: ${{ secrets.SMTP_USER }}
      FINWATCH_AUTORISER_ENVOI: ${{ vars.FINWATCH_AUTORISER_ENVOI }}
      FINWATCH_MAX_DESTINATAIRES: '50'
      FINWATCH_TEST_EMAIL: ${{ secrets.FINWATCH_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Tests automatiques
        run: python -m pytest tests -q
      - name: Vérifier les secrets d'envoi
        if: env.FINWATCH_AUTORISER_ENVOI == 'OUI'
        run: |
          test -n "$GOOGLE_SHEET_ID" || exit 1
          test -n "$GOOGLE_CREDENTIALS_JSON" || exit 1
          test -n "$FINWATCH_WEBAPP_URL" || exit 1
          test -n "$FINWATCH_HMAC_SECRET" || exit 1
          test -n "$SMTP_USER" || exit 1
          test -n "$SMTP_PASSWORD" || exit 1
      - name: Test privé (un seul destinataire)
        if: github.event_name == 'workflow_dispatch' && inputs.mode_test_prive
        env:
          FINWATCH_AUTORISER_ENVOI: 'NON'
          TEST_CAMPAIGN: ${{ inputs.campagne_test }}
        run: |
          python src/diffusion_automatique.py --campagne-test "$TEST_CAMPAIGN" --test-email "$FINWATCH_TEST_EMAIL" --send
      - name: Diffusion (mode simulation par défaut)
        if: github.event_name == 'schedule' || !inputs.mode_test_prive
        run: |
          if [ "$FINWATCH_AUTORISER_ENVOI" = "OUI" ]; then
            python src/diffusion_automatique.py --send
          else
            python src/diffusion_automatique.py
          fi
