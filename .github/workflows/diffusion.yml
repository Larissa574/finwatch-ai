name: FINWATCH - Bulletin hebdomadaire

on:
  schedule:
    - cron: "17 6 * * 1"   # lundi 07h17 heure du Bénin (UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Aperçu sans envoi"
        type: boolean
        default: false

jobs:
  diffusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Diffuser
        env:
          STORE: sheets
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python diffusion.py diffuser --dry-run
          else
            python diffusion.py diffuser
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apercu-bulletin
          path: bulletin_apercu.html
          if-no-files-found: ignore
