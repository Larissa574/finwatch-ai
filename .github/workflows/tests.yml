name: FINWATCH AI - Tests manuels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer les dependances sans les modeles IA lourds
        run: python -m pip install -r requirements.txt
      - name: Executer les tests unitaires et d'integration simulee
        run: python -m pytest tests -v
