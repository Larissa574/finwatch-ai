name: Vérification manuelle du contrat

# Déclenchement manuel uniquement : pas de tests à chaque push.
on:
  workflow_dispatch:

jobs:
  contrat:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier les exemples et la configuration
        run: python -m unittest discover -s tests -v

# À utiliser uniquement après validation du groupe.
# Aucun collecteur RSS/API ni envoi d'e-mails n'est lancé par ce workflow.
