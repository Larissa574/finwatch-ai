name: FINWATCH AI - collecte et analyse
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
concurrency:
  group: finwatch-collecte
  cancel-in-progress: false
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      IA_API_KEY: ${{ secrets.IA_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Vérifier configuration
        run: |
          test -n "$GOOGLE_SHEET_ID" || { echo "Secret GOOGLE_SHEET_ID manquant"; exit 1; }
          test -n "$GOOGLE_CREDENTIALS_JSON" || { echo "Secret GOOGLE_CREDENTIALS_JSON manquant"; exit 1; }
          test -n "$IA_API_KEY" || { echo "Secret IA_API_KEY manquant"; exit 1; }
      - run: python -m pip install -r requirements.txt transformers torch sentencepiece
      - name: Exécuter les tests
        run: python -m pytest tests -q
      - name: Collecter
        run: python src/collecte.py
      - name: Importer les publications
        run: python src/importer_stockage.py
      - name: Détecter les nouveautés
        run: |
          python -c 'import json,os,pathlib; p=pathlib.Path("data/collecte/nouvelles_publications.json"); data=json.loads(p.read_text(encoding="utf-8")); assert isinstance(data,list); print("Nouveautés :",len(data)); open(os.environ["GITHUB_ENV"],"a").write("HAS_NEWS="+("true" if data else "false")+"\n")'
      - name: Analyser les nouveautés
        if: env.HAS_NEWS == 'true'
        run: python src/analyse.py --entree data/collecte/nouvelles_publications.json --sortie data/analyse/publications_analysees.json
      - name: Importer les analyses
        if: env.HAS_NEWS == 'true'
        run: python src/importer_analyses.py
